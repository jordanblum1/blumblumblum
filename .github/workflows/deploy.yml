name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured as a repository secret"
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stage public files
        run: |
          set -euo pipefail

          mkdir _deploy
          cp \
            index.html \
            site.webmanifest \
            favicon.ico \
            favicon-16x16.png \
            favicon-32x32.png \
            apple-touch-icon.png \
            android-chrome-192x192.png \
            android-chrome-512x512.png \
            _deploy/
          cp -R assets css js _deploy/

      - name: Sync to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Default policy (HTML, manifest, favicons): always revalidate so a
          # deploy plus the CloudFront invalidation below lands immediately.
          aws s3 sync _deploy/ "s3://$S3_BUCKET" \
            --delete \
            --only-show-errors \
            --cache-control "public, max-age=0, must-revalidate"

          # Unfingerprinted code: short TTL keeps deploys fresh while sparing
          # repeat requests within a visit.
          for dir in css js; do
            aws s3 cp "_deploy/$dir" "s3://$S3_BUCKET/$dir" \
              --recursive \
              --only-show-errors \
              --cache-control "public, max-age=300, stale-while-revalidate=3600"
          done

          # Media: a day fresh, then a week of stale-while-revalidate.
          aws s3 cp _deploy/assets "s3://$S3_BUCKET/assets" \
            --recursive \
            --only-show-errors \
            --cache-control "public, max-age=86400, stale-while-revalidate=604800"

          # Fonts never change once shipped.
          aws s3 cp _deploy/assets/fonts "s3://$S3_BUCKET/assets/fonts" \
            --recursive \
            --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        id: invalidate
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "invalidation_id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Wait for CloudFront invalidation
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          INVALIDATION_ID: ${{ steps.invalidate.outputs.invalidation_id }}
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Verify production
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            https://www.blumblumblum.com/ \
            | grep --fixed-strings --quiet '<title>blumblumblum — Jordan’s corner of the internet</title>'
