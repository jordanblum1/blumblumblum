<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon-motion photos-mark blum-photos-svg" data-icon-motion="photos" data-duration="2160" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  <style>
    svg.blum-photos-svg .blum-photos-scene {
      transform-box: view-box;
      transform-origin: 12px 12px;
    }
    svg.blum-photos-svg .blum-photos-day {
      opacity: 1;
    }
    svg.blum-photos-svg .blum-photos-night {
      opacity: 0;
    }
    svg.blum-photos-svg .blum-photos-sea {
      opacity: 0;
    }

    svg.blum-photos-svg.is-playing .blum-photos-scene {
      animation-duration: 2160ms;
      animation-delay: 0s;
      animation-iteration-count: 1;
      animation-timing-function: var(--ease, cubic-bezier(0.2, 0.8, 0.2, 1));
      animation-fill-mode: both;
    }
    svg.blum-photos-svg.is-playing .blum-photos-day {
      animation-name: blum-photos-play-day;
    }
    svg.blum-photos-svg.is-playing .blum-photos-night {
      animation-name: blum-photos-play-night;
    }
    svg.blum-photos-svg.is-playing .blum-photos-sea {
      animation-name: blum-photos-play-sea;
    }
    @keyframes blum-photos-play-day {
      0%, 7.407407% { opacity: 1; transform: translateX(0); }
      17.592593% { opacity: 0; transform: translateX(-3.25px); }
      18%, 74.074074% { opacity: 0; transform: translateX(3.25px); }
      84.259259%, 100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes blum-photos-play-night {
      0%, 7.407407% { opacity: 0; transform: translateX(3.25px); }
      17.592593%, 40.740741% { opacity: 1; transform: translateX(0); }
      50.925926%, 100% { opacity: 0; transform: translateX(-3.25px); }
    }
    @keyframes blum-photos-play-sea {
      0%, 40.740741% { opacity: 0; transform: translateX(3.25px); }
      50.925926%, 74.074074% { opacity: 1; transform: translateX(0); }
      84.259259%, 100% { opacity: 0; transform: translateX(-3.25px); }
    }
    @media (prefers-reduced-motion: reduce) {
      svg.blum-photos-svg .blum-photos-scene {
        animation: none !important;
        transform: none !important;
      }
      svg.blum-photos-svg .blum-photos-day { opacity: 1 !important; }
      svg.blum-photos-svg .blum-photos-night,
      svg.blum-photos-svg .blum-photos-sea { opacity: 0 !important; }
    }
  </style>
  <defs>
    <clipPath id="blum-photos-scene-clip">
      <rect x="3.85" y="5.85" width="16.3" height="12.3" rx="1.15" />
    </clipPath>
  </defs>
  <g clip-path="url(#blum-photos-scene-clip)">
    <g class="blum-photos-scene blum-photos-day" opacity="1">
      <circle cx="8.5" cy="10" r="1.5" />
      <path d="m5.5 17 4-4 3 2.75 2.5-2.5 3.5 3.75" />
    </g>
    <g class="blum-photos-scene blum-photos-night" opacity="0">
      <path d="m5.5 17 4-4 3 2.75 2.5-2.5 3.5 3.75" />
      <path fill="currentColor" stroke="none" d="M15.624 7.635A2.3 2.3 0 1 0 18.565 10.576A2.1 2.1 0 0 1 15.624 7.635Z" />
      <g fill="currentColor" stroke="none">
        <circle cx="7" cy="8.5" r="0.45" />
        <circle cx="10.4" cy="10.2" r="0.45" />
      </g>
    </g>
    <g class="blum-photos-scene blum-photos-sea" opacity="0">
      <circle cx="15.7" cy="9.4" r="1.35" />
      <path d="M4.8 13.8H19.2" />
      <path d="M6.3 16.3Q8.5 15.2 10.7 16.3T15.1 16.3" />
    </g>
  </g>
  <rect class="blum-photos-frame" x="3" y="5" width="18" height="14" rx="2" />
</svg>
