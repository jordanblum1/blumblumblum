<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="icon-motion wing-mark" data-icon-motion="wings" data-duration="780" aria-hidden="true" focusable="false"><style>svg[data-icon-motion="wings"] { fill:currentColor;stroke:none; }
.blum-wing-holes,.blum-wing-crumbs { opacity:0; }
.blum-wing-body { transform-origin:12px 12px; }
svg[data-icon-motion="wings"].is-playing .blum-wing-body { animation:blum-wing-bite-play 780ms cubic-bezier(.2,.8,.2,1) both; }
svg[data-icon-motion="wings"].is-playing .blum-wing-holes { animation:blum-wing-holes-play 780ms steps(1) both; }
svg[data-icon-motion="wings"].is-playing .blum-wing-crumbs { animation:blum-wing-crumbs-play 780ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes blum-wing-bite-play { 0%,65%,100% { transform:translate(0px,0px) rotate(0deg); } 18% { transform:translate(-.5px,.4px) rotate(-4deg); } }
@keyframes blum-wing-holes-play { 0%,100% { opacity:0; } 15% { opacity:1; } }
@keyframes blum-wing-crumbs-play { 0%,14%,80%,100% { opacity:0;transform:translate(0px,0px); } 18% { opacity:1; } 72% { opacity:0;transform:translate(1.2px,2px); } }
@media(prefers-reduced-motion:reduce) { svg[data-icon-motion="wings"] * { animation:none!important;transform:none!important; } svg[data-icon-motion="wings"] .blum-wing-holes,svg[data-icon-motion="wings"] .blum-wing-crumbs { opacity:0!important; } }
