<clipPath id="blum-jrb-right-clip"><rect x="116" y="0" width="76" height="192"/></clipPath></defs><g class="blum-jrb-settled"><rect width="192" height="192" mask="url(#blum-jrb-source)"/></g><g class="blum-jrb-fragments"><g class="blum-jrb-piece blum-jrb-upper"><g clip-path="url(#blum-jrb-upper-clip)"><g clip-path="url(#blum-jrb-ring)"><rect width="192" height="192" mask="url(#blum-jrb-source)"/></g></g></g><g class="blum-jrb-piece blum-jrb-lower"><g clip-path="url(#blum-jrb-lower-clip)"><g clip-path="url(#blum-jrb-ring)"><rect width="192" height="192" mask="url(#blum-jrb-source)"/></g></g></g><g class="blum-jrb-piece blum-jrb-left"><g clip-path="url(#blum-jrb-left-clip)"><g clip-path="url(#blum-jrb-core)"><rect width="192" height="192" mask="url(#blum-jrb-source)"/></g></g></g><g class="blum-jrb-piece blum-jrb-spine"><g clip-path="url(#blum-jrb-spine-clip)"><g clip-path="url(#blum-jrb-core)"><rect width="192" height="192" mask="url(#blum-jrb-source)"/></g></g></g><g class="blum-jrb-piece blum-jrb-right"><g clip-path="url(#blum-jrb-right-clip)"><g clip-path="url(#blum-jrb-core)"><rect width="192" height="192" mask="url(#blum-jrb-source)"/></g></g></g></g></svg>
