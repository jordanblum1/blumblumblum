<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 240 240" class="icon-motion jrb-mark" data-icon-motion="jrb" data-duration="700" width="192" height="192" aria-hidden="true" focusable="false"><style>svg[data-icon-motion="jrb"] { fill:currentColor; stroke:none; }
.blum-jrb-settled { opacity:1; }
.blum-jrb-fragments { opacity:0; }
.blum-jrb-piece { transform-box:view-box; }
svg[data-icon-motion="jrb"].is-playing .blum-jrb-settled { animation:blum-jrb-settled-play 700ms steps(1,end) both; }
svg[data-icon-motion="jrb"].is-playing .blum-jrb-fragments { animation:blum-jrb-fragments-play 700ms steps(1,end) both; }
@keyframes blum-jrb-settled-play { 0% { opacity:0; } 100% { opacity:1; } }
@keyframes blum-jrb-fragments-play { 0% { opacity:1; } 100% { opacity:0; } }
svg[data-icon-motion="jrb"]:not(.is-controlled) .blum-jrb-upper { animation:blum-jrb-upper-idle 8s cubic-bezier(.2,.8,.2,1) 2.5s infinite both; }
svg[data-icon-motion="jrb"].is-playing .blum-jrb-upper { animation:blum-jrb-upper-play 700ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes blum-jrb-upper-play { 0%,100% { transform:translate(0px,0px); } 28% { transform:translate(0px,-6px); } 72% { transform:translate(0.0px,0.8999999999999999px); } }
@keyframes blum-jrb-upper-idle { 0%,8.75%,100% { transform:translate(0px,0px); } 2.45% { transform:translate(0px,-6px); } 6.3% { transform:translate(0.0px,0.8999999999999999px); } }
svg[data-icon-motion="jrb"]:not(.is-controlled) .blum-jrb-lower { animation:blum-jrb-lower-idle 8s cubic-bezier(.2,.8,.2,1) 2.5s infinite both; }
svg[data-icon-motion="jrb"].is-playing .blum-jrb-lower { animation:blum-jrb-lower-play 700ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes blum-jrb-lower-play { 0%,100% { transform:translate(0px,0px); } 28% { transform:translate(0px,6px); } 72% { transform:translate(0.0px,-0.8999999999999999px); } }
@keyframes blum-jrb-lower-idle { 0%,8.75%,100% { transform:translate(0px,0px); } 2.45% { transform:translate(0px,6px); } 6.3% { transform:translate(0.0px,-0.8999999999999999px); } }
svg[data-icon-motion="jrb"]:not(.is-controlled) .blum-jrb-left { animation:blum-jrb-left-idle 8s cubic-bezier(.2,.8,.2,1) 2.5s infinite both; }
svg[data-icon-motion="jrb"].is-playing .blum-jrb-left { animation:blum-jrb-left-play 700ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes blum-jrb-left-play { 0%,100% { transform:translate(0px,0px); } 28% { transform:translate(-16px,4px); } 72% { transform:translate(2.4px,-0.6px); } }
@keyframes blum-jrb-left-idle { 0%,8.75%,100% { transform:translate(0px,0px); } 2.45% { transform:translate(-16px,4px); } 6.3% { transform:translate(2.4px,-0.6px); } }
svg[data-icon-motion="jrb"]:not(.is-controlled) .blum-jrb-spine { animation:blum-jrb-spine-idle 8s cubic-bezier(.2,.8,.2,1) 2.5s infinite both; }
svg[data-icon-motion="jrb"].is-playing .blum-jrb-spine { animation:blum-jrb-spine-play 700ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes blum-jrb-spine-play { 0%,100% { transform:translate(0px,0px); } 28% { transform:translate(0px,-14px); } 72% { transform:translate(0.0px,2.1px); } }
@keyframes blum-jrb-spine-idle { 0%,8.75%,100% { transform:translate(0px,0px); } 2.45% { transform:translate(0px,-14px); } 6.3% { transform:translate(0.0px,2.1px); } }
svg[data-icon-motion="jrb"]:not(.is-controlled) .blum-jrb-right { animation:blum-jrb-right-idle 8s cubic-bezier(.2,.8,.2,1) 2.5s infinite both; }
svg[data-icon-motion="jrb"].is-playing .blum-jrb-right { animation:blum-jrb-right-play 700ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes blum-jrb-right-play { 0%,100% { transform:translate(0px,0px); } 28% { transform:translate(16px,4px); } 72% { transform:translate(-2.4px,-0.6px); } }
@keyframes blum-jrb-right-idle { 0%,8.75%,100% { transform:translate(0px,0px); } 2.45% { transform:translate(16px,4px); } 6.3% { transform:translate(-2.4px,-0.6px); } }
svg[data-icon-motion="jrb"]:not(.is-controlled):not(.is-playing) .blum-jrb-settled { animation:blum-jrb-settled-idle 8s steps(1,end) 2.5s infinite; }
svg[data-icon-motion="jrb"]:not(.is-controlled):not(.is-playing) .blum-jrb-fragments { animation:blum-jrb-fragments-idle 8s steps(1,end) 2.5s infinite; }
@keyframes blum-jrb-settled-idle { 0% { opacity:0; } 8.75%,100% { opacity:1; } }
@keyframes blum-jrb-fragments-idle { 0% { opacity:1; } 8.75%,100% { opacity:0; } }
@media(prefers-reduced-motion:reduce) { svg[data-icon-motion="jrb"] .blum-jrb-piece { animation:none!important;transform:none!important; } svg[data-icon-motion="jrb"] .blum-jrb-settled { animation:none!important;opacity:1!important; } svg[data-icon-motion="jrb"] .blum-jrb-fragments { animation:none!important;opacity:0!important; } }
</style><defs><mask id="blum-jrb-source" maskUnits="userSpaceOnUse" x="0" y="0" width="192" height="192" style="mask-type:alpha"><image href="data:image/webp;base64," width="192" height="192"/></mask>
