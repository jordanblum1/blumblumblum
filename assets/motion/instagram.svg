<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="icon-motion instagram-mark" data-icon-motion="instagram" data-duration="560" aria-hidden="true" focusable="false">
  <style>
    .blum-instagram-curtain-upper {
      transform: translateY(-4.1px);
      animation: blum-instagram-upper-idle 8000ms cubic-bezier(0.2, 0.8, 0.2, 1) 2500ms infinite;
    }
    .blum-instagram-curtain-lower {
      transform: translateY(4.1px);
      animation: blum-instagram-lower-idle 8000ms cubic-bezier(0.2, 0.8, 0.2, 1) 2500ms infinite;
    }
    .is-controlled .blum-instagram-curtain-upper,
    .is-controlled .blum-instagram-curtain-lower {
      animation: none;
    }
    .is-playing .blum-instagram-curtain-upper {
      animation: blum-instagram-upper-shot 560ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    .is-playing .blum-instagram-curtain-lower {
      animation: blum-instagram-lower-shot 560ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes blum-instagram-upper-shot {
      0%, 100% { transform: translateY(-4.1px); }
      32%, 58% { transform: translateY(-0.35px); }
    }
    @keyframes blum-instagram-lower-shot {
      0%, 100% { transform: translateY(4.1px); }
      32%, 58% { transform: translateY(0.35px); }
    }
    @keyframes blum-instagram-upper-idle {
      0%, 7%, 100% { transform: translateY(-4.1px); }
      2.24%, 4.06% { transform: translateY(-0.35px); }
    }
    @keyframes blum-instagram-lower-idle {
      0%, 7%, 100% { transform: translateY(4.1px); }
      2.24%, 4.06% { transform: translateY(0.35px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .blum-instagram-curtain-upper {
        animation: none !important;
        transform: translateY(-4.1px) !important;
      }
      .blum-instagram-curtain-lower {
        animation: none !important;
        transform: translateY(4.1px) !important;
      }
    }
  </style>
  <defs>
    <clipPath id="blum-instagram-shutter-clip" clipPathUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="3.15"/>
    </clipPath>
  </defs>
  <rect class="blum-instagram-frame" x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="blum-instagram-shutter" transform="translate(12 12) rotate(-35)">
    <g clip-path="url(#blum-instagram-shutter-clip)" fill="currentColor" stroke="none">
      <rect class="blum-instagram-curtain-upper" x="-4" y="-4" width="8" height="4" transform="translate(0 -4.1)"/>
      <rect class="blum-instagram-curtain-lower" x="-4" y="0" width="8" height="4" transform="translate(0 4.1)"/>
    </g>
  </g>
  <circle class="blum-instagram-lens" cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="blum-instagram-dot" cx="17.5" cy="6.5" r=".65" fill="currentColor" stroke="none"/>
</svg>
