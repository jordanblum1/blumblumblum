<svg xmlns="http://www.w3.org/2000/svg" class="icon-motion github-mark blum-github-root" data-icon-motion="github" data-duration="800" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true" focusable="false">
  <style>
    .blum-github-root .blum-github-native-mark { fill: currentColor; stroke: none; }
    .blum-github-root .blum-github-glasses {
      fill: currentColor;
      stroke: none;
      opacity: 0;
      transform: translateY(-3.2px);
    }
    .blum-github-root:not(.is-controlled) .blum-github-glasses {
      animation: blum-github-glasses-idle 8s var(--ease, cubic-bezier(0.2, 0.8, 0.2, 1)) 2.5s infinite both;
    }
    .blum-github-root.is-controlled .blum-github-glasses { animation: none; }
    .blum-github-root.is-playing .blum-github-glasses {
      animation: blum-github-glasses-play 800ms var(--ease, cubic-bezier(0.2, 0.8, 0.2, 1)) both;
    }
    @keyframes blum-github-glasses-idle {
      0% { opacity: 0; transform: translateY(-3.2px); }
      2.75%, 8.25% { opacity: 1; transform: translateY(0); }
      10%, 100% { opacity: 0; transform: translateY(-3.2px); }
    }
    @keyframes blum-github-glasses-play {
      0% { opacity: 0; transform: translateY(-3.2px); }
      27.5%, 82.5% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-3.2px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .blum-github-root .blum-github-glasses {
        animation: none !important;
        opacity: 0 !important;
        transform: translateY(-3.2px) !important;
      }
    }
  </style>
